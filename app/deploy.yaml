apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-uploader
spec:
  replicas: 1
  selector:
    matchLabels: {app: s3-uploader}
  template:
    metadata:
      labels: {app: s3-uploader}
    spec:
      containers:
      - name: app
        image: s3-uploader:1
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: aws-creds
        env:
        - name: S3_BUCKET
          value: prathamesh-s3-upload-demo
        - name: AWS_DEFAULT_REGION
          value: ap-south-1
---
apiVersion: v1
kind: Service
metadata:
  name: s3-uploader
spec:
  type: NodePort
  selector: {app: s3-uploader}
  ports:
  - port: 80
    targetPort: 5000
